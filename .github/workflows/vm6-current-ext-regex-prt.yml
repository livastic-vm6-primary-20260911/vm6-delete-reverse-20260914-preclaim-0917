name: VM6 Current External Regex Trusted PRT
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
permissions:
  contents: write
jobs:
  vm6-ext-regex-release:
    name: vm6-ext-regex-release
    runs-on: ubuntu-latest
    steps:
      - name: Create release for this workflow attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vm6-current-ext-regex-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes 'Controlled current-production Auto-Retry external-fork canary.'
  vm6-ext-regex-trigger:
    name: vm6-ext-regex-trigger
    runs-on: ubuntu-latest
    steps:
      - name: Echo attacker-controlled PR title and fail only first attempt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then exit 1; fi
          exit 0
