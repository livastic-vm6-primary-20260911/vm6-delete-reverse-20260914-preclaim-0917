name: VM6 Current External Regex OIDC Trusted PRT
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
permissions:
  contents: write
  id-token: write
jobs:
  vm6-ext-regex-release:
    name: vm6-ext-regex-release
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled release for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vm6-current-ext-oidc-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes 'Controlled Auto-Retry OIDC capability canary.'
  vm6-ext-regex-oidc:
    name: vm6-ext-regex-oidc
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token and print claims only
        env:
          AUD: vm6-current-auto-retry-oidc
        run: |
          token="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" | jq -r .value)"
          TOKEN="$token" python3 - <<'PY'
          import os, json, base64
          token=os.environ['TOKEN']
          payload=token.split('.')[1]
          payload += '=' * (-len(payload)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          keep=['aud','sub','repository','repository_owner','ref','sha','actor','workflow','run_id','run_number','run_attempt','event_name','iat','exp']
          print('VM6_OIDC_CLAIMS='+json.dumps({k:claims.get(k) for k in keep}, sort_keys=True))
          PY
  vm6-ext-regex-trigger:
    name: vm6-ext-regex-trigger
    runs-on: ubuntu-latest
    steps:
      - name: Echo attacker-controlled PR title and fail first attempt only
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then exit 1; fi
          exit 0
